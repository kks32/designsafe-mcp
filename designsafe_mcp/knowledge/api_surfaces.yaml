# One blessed API surface: the current dapi. A notebook either uses it,
# or it is stale and must be modernized before it can seed a snippet;
# we do not maintain a taxonomy of past eras. audit.py loads this.

surfaces:
  - status: current-dapi
    meaning: the current dapi DSClient surface, the only orchestration
      style agents may learn from
    markers:
      - 'ds\.jobs\.generate'
      - 'ds\.jobs\.parametric_sweep'
      - 'dapi\.workflows'
      - 'from dapi import DSClient'

  - status: stale
    meaning: anything else that submits work (retired dapi idioms or
      raw tapipy); flagged in search, excluded from snippets, fixed by
      rewriting against current dapi
    markers:
      - 'dapi\.auth\.init'
      - 'generate_job_info'
      - 'dapi\.jobs\.get_status'
      - 'from agavepy'
      - 'dapi\.jobs\.submit_job'
      - 'from tapipy'
      - 'Tapis\('
      - 't\.jobs\.submitJob'
      - 'getClient'

# Matching none of the above and containing no submission calls means
# local-only (post-processing, teaching material).
submission_markers:
  - 'submitJob'
  - 'jobs\.submit'
  - 'parametric_sweep'
  - 'pipeline'
