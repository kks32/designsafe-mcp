# The OpenSees decision matrix. Domain content, edited here and
# reviewed like prose; matrix.py only loads it.
variants:
- variant: OpenSeesPy (JupyterHub)
  app_id: null
  when: Python model, small enough for an interactive session
  notes: no job at all; move to python-s3 when it outgrows the VM
- variant: OpenSeesPy at scale
  app_id: python-s3
  when: Python model, large runs or parameter sweeps (PyLauncher)
  notes: EXTRA_MODULES=opensees; sweeps via ds.jobs.parametric_sweep
- variant: OpenSeesEXPRESS
  app_id: opensees-express
  when: Tcl model, serial, wants immediate start
  notes: runs on a VM; no queue, no allocation; shared machine
- variant: OpenSees (serial on HPC)
  app_id: opensees-s3
  when: Tcl model, serial, needs Stampede3 (reservation, classroom, big memory)
  notes: Main Program appArg selects the binary; 1 core of 1 node
- variant: OpenSeesSP
  app_id: opensees-s3
  when: Tcl model, ONE large domain; parallel equation solver
  notes: one driver process; Main Program=OpenSeesSP
- variant: OpenSeesMP
  app_id: opensees-mp-s3
  when: Tcl model partitioned into subdomains, or many motions/models in parallel
  notes: every rank runs your script; ranks = nodes x cores; getPID/getNP
- variant: quoFEM over OpenSees
  app_id: simcenter-uq-stampede3
  when: UQ, sensitivity, or parameter calibration wrapping an OpenSees model
  notes: Bayesian calibration and Sobol indices; model becomes the forward solver
legend:
  run-serial: run the sequential application interactively (small jobs)
  run-mpi: run the parallel application interactively using MPI (small jobs)
  run-mpi-large: run the parallel application interactively using MPI (large jobs)
  submit-express: submit sequential jobs to the OpenSees-EXPRESS VM (small jobs)
  submit-hpc-small: submit parallel jobs to the HPC small queue (small-medium
    jobs)
  submit-hpc: submit parallel jobs to HPC (large jobs)
  submit-launcher: submit sets of parallel jobs through a launcher (large sets
    of large jobs)
  inefficient: possible, but not the most efficient way to run this
  unavailable: not available on this interface
platform_matrix:
- scope: small
  platform: Interactive VM
  interface: Linux terminal
  sequential: run-serial
  sp: run-mpi
  mp: run-mpi
  openseespy: run-mpi
- scope: small
  platform: Interactive VM
  interface: Jupyter notebook
  sequential: unavailable
  sp: unavailable
  mp: unavailable
  openseespy: run-mpi
- scope: small
  platform: Interactive VM
  interface: Python console
  sequential: unavailable
  sp: unavailable
  mp: unavailable
  openseespy: run-mpi
- scope: small-medium
  platform: Web portal
  interface: OpenSees-EXPRESS VM
  sequential: submit-express
  sp: unavailable
  mp: unavailable
  openseespy: unavailable
- scope: small-medium
  platform: Web portal
  interface: small-queue HPC app
  sequential: inefficient
  sp: submit-hpc-small
  mp: submit-hpc-small
  openseespy: unavailable
- scope: small-large
  platform: JupyterHub VM
  interface: Jupyter notebook
  sequential: submit-express
  sp: submit-hpc
  mp: submit-hpc
  openseespy: run-serial
- scope: small-large
  platform: JupyterHub VM
  interface: console
  sequential: submit-express
  sp: submit-hpc
  mp: submit-hpc
  openseespy: run-serial
- scope: small-large
  platform: JupyterHub VM
  interface: Linux terminal
  sequential: unavailable
  sp: unavailable
  mp: unavailable
  openseespy: run-serial
- scope: large-xlarge
  platform: HPC (TACC)
  interface: Linux terminal
  sequential: inefficient
  sp: run-mpi-large
  mp: run-mpi-large
  openseespy: run-mpi-large
- scope: large-xlarge
  platform: HPC (TACC)
  interface: launcher
  sequential: inefficient
  sp: submit-launcher
  mp: submit-launcher
  openseespy: submit-launcher
notes:
- The Interactive VM, OpenSees-EXPRESS, and JupyterHub each run on a dedicated
  shared-resource VM; no allocation is needed there.
- HPC submissions through Tapis apps (opensees-s3, opensees-mp-s3, python-s3)
  need a TACC allocation and archive to Stampede3.
- 'From the JupyterHub notebook, dapi is the submission path: the notebook stays
  the record while jobs run on HPC.'
- Job submission through an agent goes through dapi app ids, never a terminal
  on the compute node; the scope column still governs which variant fits.
