[project]
name = "designsafe-mcp"
version = "0.1.0"
description = "Agent-first scientific workflow actions for DesignSafe: an MCP layer over dapi and Tapis"
requires-python = ">=3.10"
dependencies = ["dapi>=0.6.0", "mcp>=1.0", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["designsafe_mcp"]
